# 供应商下全部模型共用 adapter；执行器自动加载。
providers:
  openai:
    base_url: https://api.openai.com/v1
    timeout: 60
    models:
      gpt-4o-mini: {}
    adapter: openai
  anthropic:
    base_url: https://api.anthropic.com/v1
    timeout: 60
    models:
      claude-sonnet-4-5: {}
    adapter: anthropic
  deepseek:
    base_url: https://api.deepseek.com/v1
    timeout: 60
    models:
      deepseek-chat: {}
    adapter: deepseek
